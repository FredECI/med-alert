<style>

    display: inline-block;

    margin: 0 0.25rem 0.3rem 0;
    border-radius: 999px;
    font-size: 0.72rem;

    background: #e8eaed;
    color: #333;
  }
  .badge--region { background: #dbeafe; color: #1e3a5f; }
  .badge--source { background: #f1f3f4; color: #5f6368; }
  .badge--concurso          { background: #d7f0dd; color: #17512a; }
  .badge--processo_seletivo { background: #d9ecf7; color: #10425c; }
  .badge--residencia        { background: #ede0f7; color: #442065; }
  .badge--emprego           { background: #fdeacc; color: #6b3d05; }

  .job-deadline { color: #5f6368; }
  .job-specialties { margin-top: 0.25rem; }
