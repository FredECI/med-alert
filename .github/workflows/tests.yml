name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Rodar testes
      run: pytest -v

  worker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar o Node
      uses: actions/setup-node@v4
      with:
        # Mesma versão exigida pelo wrangler (ver worker/package.json), para o
        # CI não validar num runtime diferente do usado no deploy.
        node-version: '22'

    # O runner embutido do Node basta: a lógica testada é pura (montagem de
    # teclado, marcação de opções), sem rede nem KV — nenhuma dependência
    # precisa ser instalada.
    # Sem argumento de propósito: o Node autodescobre os arquivos de teste.
    # Passar `test/` quebra a partir do Node 24, que tenta carregar o
    # diretório como módulo em vez de varrê-lo.
    - name: Rodar testes do Worker
      working-directory: worker
      run: node --test
