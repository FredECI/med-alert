name: MedAlert Bot

on:
  schedule:
    # Roda todos os dias às 08:00 e 18:00 (Horário de Brasília)
    # O Cron do GitHub usa UTC. Brasília é UTC-3.
    # Portanto, 11:00 UTC = 08:00 BRT | 21:00 UTC = 18:00 BRT
    - cron: '0 11,21 * * *'
  workflow_dispatch: # Adiciona um botão no GitHub para você rodar manualmente quando quiser

# Evita duas execuções escrevendo/commitando ao mesmo tempo (ex: um
# workflow_dispatch manual disparado enquanto o cron agendado ainda está
# rodando) — em vez de cancelar a que já está rodando (o que arriscaria
# deixar inserts no banco/envios de Telegram pela metade), a nova espera.
concurrency:
  group: scraper-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      run: python main.py

    - name: Salvar Arquivos
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add med_alerts.db vagas_abertas.csv index.md
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Atualizando banco e relatórios de vagas"
        git push