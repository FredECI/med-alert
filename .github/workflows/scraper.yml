name: MedAlert Bot

on:
  schedule:
    # Roda todos os dias às 08:00 e 18:00 (Horário de Brasília)
    # O Cron do GitHub usa UTC. Brasília é UTC-3.
    # Portanto, 11:00 UTC = 08:00 BRT | 21:00 UTC = 18:00 BRT
    - cron: '0 11,21 * * *'
  workflow_dispatch: # Adiciona um botão no GitHub para você rodar manualmente quando quiser

# Evita duas execuções escrevendo/commitando ao mesmo tempo (ex: um
# workflow_dispatch manual disparado enquanto o cron agendado ainda está
# rodando) — em vez de cancelar a que já está rodando (o que arriscaria
# deixar inserts no banco/envios de Telegram pela metade), a nova espera.
concurrency:
  group: scraper-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    # Uma rodada saudável leva ~30s (medido com as 25 fontes). O teto precisa
    # cobrir o pior caso: são ~30 URLs (algumas fontes varrem várias páginas),
    # 3 tentativas cada com 15s de timeout mais backoff, o que numa queda
    # generalizada passa de 25 min. Com um teto curto o job seria morto ANTES
    # do `git push` — perdendo as inserções no banco depois de já ter enviado
    # os alertas, o que faria as mesmas vagas serem notificadas de novo.
    timeout-minutes: 30

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar o Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        # Quem recebe alerta vem do Worker (Cloudflare KV), não daqui: a lista
        # é montada pelos próprios usuários via /start no bot. O antigo
        # TELEGRAM_CHAT_IDS não é mais lido e pode ser apagado dos Secrets.
        MEDALERT_WORKER_URL: ${{ secrets.MEDALERT_WORKER_URL }}
        MEDALERT_SYNC_TOKEN: ${{ secrets.MEDALERT_SYNC_TOKEN }}
        # Só para avisos de operação (ex: falha total dos scrapers), que não
        # devem ir para a base de assinantes.
        TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      run: python main.py

    - name: Salvar Arquivos
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add med_alerts.db vagas_abertas.csv _data/jobs.json _data/robot_status.json
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Atualizando banco e relatórios de vagas"
        git push